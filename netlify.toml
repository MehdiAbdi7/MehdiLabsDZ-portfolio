# Netlify lit ce fichier à la RACINE du dépôt.
# `base` indique le sous-dossier à builder (le front Next.js).
# `publish` est relatif à `base`, donc ".next" correspond à client/.next.
# Il doit être déclaré explicitement : sans lui, Netlify le fait retomber
# sur la valeur de `base`, et le runtime Next.js refuse ce cas.

[build]
  base = "client"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# En-têtes de sécurité de base pour tout le site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[plugins]]
  package = "@netlify/plugin-nextjs"